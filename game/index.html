<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Abby's Secret Pool Game 🤫</title>
<meta name="theme-color" content="#2AA7D8">
<style>
  :root{--pink:#E8398C;--pink-l:#FF7EB9;--blue:#2AA7D8;--blue-l:#8FE3FA;--yellow:#FFD86B;--ink:#5B3A22}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
  body{font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(#FFE3F1,#FFF4D6 45%,#BDEBFF);
    display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  h1{margin:14px 12px 2px;text-align:center;color:var(--pink);font-size:clamp(22px,6vw,34px);
    text-shadow:0 3px 0 #fff}
  .sub{margin:0 14px 8px;text-align:center;font-weight:bold;color:var(--blue);font-size:clamp(13px,3.6vw,17px)}

  .hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 10px 8px}
  .chip{background:#fff;border:3px solid var(--pink-l);border-radius:999px;padding:6px 14px;
    font-weight:bold;font-size:clamp(13px,3.4vw,16px);color:var(--pink)}
  .chip b{color:var(--blue)}

  #stage{position:relative;width:min(560px,96vw);flex:1;min-height:52vh;margin:0 auto;
    border:7px solid #fff;border-radius:22px;overflow:hidden;
    background:linear-gradient(#6FD8F2,#2AA7D8);box-shadow:0 8px 0 rgba(0,0,0,.14)}
  #stage .tiles{position:absolute;left:0;right:0;top:0;height:14px;
    background:repeating-linear-gradient(90deg,#4FC4E8 0 18px,#8FE3FA 18px 36px)}
  .egg{position:absolute;font-size:clamp(34px,10vw,52px);line-height:1;cursor:pointer;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transition:transform .12s}
  .egg:active{transform:scale(.85)}
  .pop{position:absolute;pointer-events:none;font-weight:bold;color:#fff;font-size:20px;
    text-shadow:0 2px 4px rgba(0,0,0,.4)}

  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 10px 18px}
  .btn{font:inherit;font-weight:bold;border:none;cursor:pointer;color:#fff;background:var(--pink);
    padding:13px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15);text-decoration:none;
    font-size:clamp(14px,3.6vw,17px)}
  .btn.blue{background:var(--blue)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}

  .over{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(circle at 50% 35%,rgba(255,126,185,.96),rgba(42,167,216,.96))}
  .over.show{display:flex}
  .box{background:#fff;border:8px solid var(--yellow);border-radius:30px;padding:24px 20px;max-width:420px;
    width:100%;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.18);animation:pop .5s cubic-bezier(.2,1.7,.5,1)}
  @keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}
  .box h2{margin:4px 0 6px;color:var(--pink);font-size:clamp(24px,7vw,38px);text-shadow:0 3px 0 var(--yellow)}
  .big{font-size:52px;line-height:1;animation:spin 2.2s ease-in-out infinite}
  @keyframes spin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}
  .code{display:inline-block;margin:10px 0 4px;background:var(--yellow);border-radius:14px;padding:10px 18px;
    font-size:clamp(20px,6vw,30px);font-weight:bold;letter-spacing:3px;color:var(--ink)}
  .tiny{font-size:13px;color:#777;margin:10px 0 0}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  .cf{position:absolute;width:10px;height:14px;border-radius:2px}
</style>
</head>
<body>

<h1>🤫 Abby's Secret Pool Game</h1>
<p class="sub">You found the hidden game on your goodie bag!<br>Catch <b>15 floaties</b> before the pool drains.</p>

<div class="hud">
  <div class="chip">Caught <b id="score">0</b>/15</div>
  <div class="chip">Time <b id="time">30</b>s</div>
  <div class="chip">Best <b id="best">0</b></div>
</div>

<div id="stage"><div class="tiles"></div></div>

<div class="btnrow">
  <button class="btn" id="go" type="button">▶️ Start</button>
  <a class="btn blue" id="invite" href="#">🎉 Party details</a>
</div>

<div class="over" id="over">
  <div class="box">
    <div class="big" id="bigicon">🏆</div>
    <h2 id="title">YOU WIN!</h2>
    <p id="msg">You caught them all!</p>
    <div class="code" id="code">SPLASH67</div>
    <p class="tiny">Show this secret word to Abby for a high five 🙌</p>
    <button class="btn" id="again" type="button">🔁 Play again</button>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
(function(){
  var stage = document.getElementById('stage'),
      scoreEl = document.getElementById('score'),
      timeEl = document.getElementById('time'),
      bestEl = document.getElementById('best'),
      go = document.getElementById('go'),
      over = document.getElementById('over'),
      host = document.getElementById('confetti');

  document.getElementById('invite').href = '../5f4aa5af/';

  var GOAL = 15, LEN = 30;
  var icons = ['🦆','🏐','🐠','🍉','🍦','🌈','⭐','🐬','🦩','🍕'];
  var colors = ['#FF7EB9','#FFD86B','#7ED8A0','#9B8CFF','#6FD8F2','#E8398C'];
  var score = 0, left = LEN, running = false, timer = null, spawner = null;

  var best = 0;
  try { best = parseInt(localStorage.getItem('abbyGameBest') || '0', 10) || 0; } catch(e){}
  bestEl.textContent = best;

  // --- sound ---
  var ac = null;
  function beep(f, d, type, vol){
    try{
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    }catch(e){}
  }

  function burst(x, y, n){
    for (var i=0;i<n;i++){
      var p = document.createElement('div');
      p.className = 'cf';
      p.style.background = colors[i % colors.length];
      p.style.left = x+'px'; p.style.top = y+'px';
      host.appendChild(p);
      var ang = Math.random()*Math.PI*2, sp = 120 + Math.random()*260;
      var vx = Math.cos(ang)*sp, vy = Math.sin(ang)*sp - 220, rot = Math.random()*720-360;
      p.animate([{transform:'translate(0,0)',opacity:1},
                 {transform:'translate('+vx+'px,'+(vy+700)+'px) rotate('+rot+'deg)',opacity:0}],
                {duration:1100+Math.random()*600,easing:'cubic-bezier(.2,.6,.4,1)'})
       .onfinish = function(){ p.remove(); };
    }
  }

  function floatUp(x, y, text){
    var d = document.createElement('div');
    d.className = 'pop'; d.textContent = text;
    d.style.left = x+'px'; d.style.top = y+'px';
    stage.appendChild(d);
    d.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-44px)',opacity:0}],
              {duration:650,easing:'ease-out'}).onfinish = function(){ d.remove(); };
  }

  function spawn(){
    if (!running) return;
    var e = document.createElement('div');
    e.className = 'egg';
    e.textContent = icons[Math.floor(Math.random()*icons.length)];
    var w = stage.clientWidth, h = stage.clientHeight;
    e.style.left = (20 + Math.random()*(w-90)) + 'px';
    e.style.top  = (26 + Math.random()*(h-90)) + 'px';
    stage.appendChild(e);
    var life = e.animate([{opacity:0,transform:'scale(.3)'},
                          {opacity:1,transform:'scale(1)',offset:.18},
                          {opacity:1,transform:'scale(1)',offset:.8},
                          {opacity:0,transform:'scale(.4)'}],
                         {duration: 1500 - Math.min(700, score*45)});
    life.onfinish = function(){ e.remove(); };
    e.addEventListener('click', function(ev){
      if (!running || e.dataset.got) return;
      e.dataset.got = '1';
      score++; scoreEl.textContent = score;
      beep(520 + score*28, 0.12, 'sine', 0.2);
      var r = stage.getBoundingClientRect();
      floatUp(parseFloat(e.style.left), parseFloat(e.style.top), '+1');
      burst(r.left + parseFloat(e.style.left) + 18, r.top + parseFloat(e.style.top) + 18, 10);
      e.remove();
      if (score >= GOAL) finish(true);
    });
  }

  function clearStage(){
    Array.prototype.slice.call(stage.querySelectorAll('.egg,.pop')).forEach(function(n){ n.remove(); });
  }

  function start(){
    clearStage();
    over.classList.remove('show');
    score = 0; left = LEN; running = true;
    scoreEl.textContent = '0'; timeEl.textContent = LEN;
    go.textContent = '⏸ Playing…';
    beep(660, 0.12, 'triangle', 0.2);
    timer = setInterval(function(){
      left--; timeEl.textContent = left;
      if (left <= 5 && left > 0) beep(300, 0.08, 'square', 0.12);
      if (left <= 0) finish(false);
    }, 1000);
    spawner = setInterval(spawn, 620);
    spawn();
  }

  function finish(won){
    running = false;
    clearInterval(timer); clearInterval(spawner);
    clearStage();
    go.textContent = '▶️ Start';
    if (score > best){
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('abbyGameBest', String(best)); } catch(e){}
    }
    document.getElementById('bigicon').textContent = won ? '🏆' : '💦';
    document.getElementById('title').textContent   = won ? 'YOU WIN!' : 'Time\u2019s up!';
    document.getElementById('msg').textContent = won
      ? 'You caught all ' + GOAL + ' floaties!'
      : 'You caught ' + score + '. Try again — you need ' + GOAL + '.';
    document.getElementById('code').style.display = won ? 'inline-block' : 'none';
    document.querySelector('.tiny').style.display = won ? 'block' : 'none';
    over.classList.add('show');
    if (won){
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){
        setTimeout(function(){ beep(f, 0.3, 'triangle', 0.22); }, i*120);
      });
      burst(window.innerWidth/2, window.innerHeight/3, 120);
      setTimeout(function(){ burst(window.innerWidth/3, window.innerHeight/2, 70); }, 320);
    } else {
      beep(200, 0.4, 'sawtooth', 0.14);
    }
  }

  go.addEventListener('click', function(){ if (!running) start(); });
  document.getElementById('again').addEventListener('click', start);

  // no pinch / double-tap zoom
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
})();
</script>
</body>
</html>
